<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <pattern id="zigzag" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 L10 0 L20 10 L10 20 Z" fill="#1a8fcf" stroke="#0a5a8f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="200" rx="12" fill="url(#zigzag)"/>
  <rect width="400" height="200" rx="12" fill="#1a8fcf" opacity="0.3"/>
  <!-- МОТО -->
  <text x="200" y="90" text-anchor="middle" fill="white" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="60" font-style="italic" letter-spacing="6">МОТО</text>
  <!-- ДРАЙВ -->
  <text x="200" y="160" text-anchor="middle" fill="white" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="60" font-style="italic" letter-spacing="6">ДРАЙВ</text>
</svg>
